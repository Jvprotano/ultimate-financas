name: Apply invoice cycle fix

on:
  push:
    branches:
      - fix/invoice-driven-cycle-close

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[invoice-cycle-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply final cleanup
        run: python scripts/apply_invoice_cycle_close_fix.py

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove temporary patch tooling
        run: rm -f scripts/apply_invoice_cycle_close_fix.py .github/workflows/apply-invoice-cycle-fix.yml

      - name: Commit validated sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize invoice-driven cycle closing [invoice-cycle-applied]"
          git push
