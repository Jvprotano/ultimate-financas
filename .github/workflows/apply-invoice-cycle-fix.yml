name: Apply invoice cycle fix

on:
  push:
    branches:
      - fix/invoice-driven-cycle-close

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[invoice-cycle-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Repair one-shot patch expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_invoice_cycle_close_fix.py')
          text = path.read_text()
          old = "detail={closingInvoiceAlreadyPaid ? 'já marcada como paga' : 'valor ainda devido'}"
          new = "detail={closingInvoiceAlreadyPaid ? 'já marcada como paga' : 'fatura completa'}"
          if old not in text:
              raise SystemExit('expected one-shot script marker not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Apply targeted patch
        run: python scripts/apply_invoice_cycle_close_fix.py

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Fix invoice-driven cycle closing [invoice-cycle-applied]"
          git push
