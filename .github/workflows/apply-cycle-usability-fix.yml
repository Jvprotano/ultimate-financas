name: Apply cycle usability fix

on:
  push:
    branches:
      - fix/invoice-driven-cycle-close

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[cycle-usability-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply patch
        run: python scripts/apply_cycle_usability_fix.py

      - name: Remove unused icon imports
        run: |
          sed -i '/  CreditCard,/d; /  Landmark,/d; /  PiggyBank,/d; /  Wallet,/d' src/components/ClosingView.tsx

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove temporary tooling
        run: git rm .github/workflows/apply-cycle-usability-fix.yml scripts/apply_cycle_usability_fix.py

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src docs .github scripts
          git commit -m "Simplify cycle and fix next-month allocation [cycle-usability-applied]"
          git push
