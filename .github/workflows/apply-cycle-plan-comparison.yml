name: Apply cycle plan comparison

on:
  push:
    branches:
      - feat/cycle-plan-comparison

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[cycle-plan-comparison-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply patch
        run: python scripts/apply_cycle_plan_comparison.py

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove temporary tooling
        run: git rm .github/workflows/apply-cycle-plan-comparison.yml scripts/apply_cycle_plan_comparison.py

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Compare cycle actuals with plan [cycle-plan-comparison-applied]"
          git push
