name: Apply realized allocation fix

on:
  push:
    branches:
      - fix/allocation-use-realized-costs

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[realized-allocation-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply patch
        run: python scripts/apply_realized_allocation_fix.py

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove temporary tooling
        run: git rm .github/workflows/apply-realized-allocation-fix.yml scripts/apply_realized_allocation_fix.py

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .github
          git commit -m "Use realized costs in next-cycle allocation [realized-allocation-applied]"
          git push
